name: Windows with MSYS2

on:
  push:
    branches: ['**']

jobs:
  windows-msys2:
    name: Windows +MSYS2
    runs-on: windows-2025

    defaults:
      run:
        shell: cmd

    strategy:
      fail-fast: false
      matrix:
        include:
          - { msys: UCRT64,  cc: gcc,   pkgs: yes    }
          - { msys: UCRT64,  cc: gcc,   pkgs: static }
          - { msys: UCRT64,  cc: clang, pkgs: yes    }
          - { msys: CLANG64, cc: clang, pkgs: yes    }
          - { msys: CLANG64, cc: clang, pkgs: static }
          - { msys: MINGW64, cc: gcc,   pkgs: yes    }
          - { msys: MINGW64, cc: clang, pkgs: yes    }
          # MIGW32 is not built because the tests are slow and time out.
          #- { msys: MINGW32, cc: gcc   }

    steps:
      - name: Setup MSYS2 packages
        uses: msys2/setup-msys2@4f806de0a5a7294ffabaff804b38a9b435a73bda # v2.30.0
        id: msys2
        with:
          update: true
          pacboy: >-
            diffutils:p
            make:p
            gcc:p
            clang:p
            llvm:p
            libiconv:p
            gettext:p
            xpm-nox:p
          msystem: ${{ matrix.msys }}
          release: false

      - name: Setup MSYS2 path
        run: |
          echo ${{ steps.msys2.outputs.msys2-location }}\%MSYSTEM%\bin>> %GITHUB_PATH%
          echo ${{ steps.msys2.outputs.msys2-location }}\usr\bin>> %GITHUB_PATH%

      - name: Checkout repository from github
        uses: actions/checkout@v6

      - name: Build (MSYS2)
        working-directory: src
        run: |
          mingw32-make -f Make_ming.mak -j4 ^
            CC=${{ matrix.cc }} ^
            FEATURES=HUGE ^
            VIMDLL=yes ^
            GUI=yes ^
            STATIC_STDCPLUS=yes ^
            USE_MSYSTEM_PACKAGES=${{ matrix.pkgs }}

      - name: Check version
        run: |
          src\vim --version || exit 1
          src\vim -u NONE -i NONE --not-a-term -esNX -V1 -S ci\if_ver-1.vim -c quit
          src\vim -u NONE -i NONE --not-a-term -esNX -V1 -S ci\if_ver-2.vim -c quit

      - name: List env
        run: set

      - name: Test Vim
        timeout-minutes: 15
        working-directory: src/testdir
        run: |
          SET SHELL=
          mingw32-make -f Make_ming.mak VIMPROG=..\vim
